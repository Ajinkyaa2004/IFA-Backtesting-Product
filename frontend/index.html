<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Identity ──────────────────────────────────────────────── -->
    <title>IFA Backtest Engine — Insight Fusion Analytics</title>
    <meta
      name="description"
      content="Insight Fusion Analytics' backtest engine — design, run and review systematic trading strategies. Client portal for IFA's research, delivery and live engine workflows."
    />
    <meta name="author" content="Insight Fusion Analytics" />
    <meta name="theme-color" content="#7c6cff" />
    <meta name="color-scheme" content="light dark" />

    <!-- ── Favicons / app icons ──────────────────────────────────── -->
    <!-- IFA brand mark (Arial Black-style purple "IFA" on a rounded white tile).
         Multiple sizes so every surface (tab, retina, iOS home screen, Android)
         gets the sharpest version it can.
         The ?v=2 cache-bust forces browsers off any stale Vite-era favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png?v=2" />
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#7c6cff" />
    <link rel="shortcut icon" href="/favicon-512.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph (shows up in Slack / WhatsApp / LinkedIn previews) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IFA Backtest Engine" />
    <meta property="og:title" content="IFA Backtest Engine" />
    <meta
      property="og:description"
      content="Client portal for Insight Fusion Analytics' systematic trading research, backtests and engine runs."
    />
    <meta property="og:url" content="https://backtestingengine.insightfusionanalytics.com" />
    <meta property="og:image" content="https://backtestingengine.insightfusionanalytics.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="IFA Backtest Engine — Systematic strategy backtests for Indian markets" />

    <!-- ── Twitter card (for X/Twitter previews) ─────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IFA Backtest Engine" />
    <meta
      name="twitter:description"
      content="Client portal for Insight Fusion Analytics' systematic trading research and backtests."
    />
    <meta name="twitter:image" content="https://backtestingengine.insightfusionanalytics.com/og-image.png" />

    <!-- ── Search-engine hints ───────────────────────────────────── -->
    <!-- `/` is the public marketing landing (index, follow). Every gated
         route overrides this with SEOHead using robots="noindex, nofollow"
         so auth-protected content stays out of search indexes. -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://backtestingengine.insightfusionanalytics.com" />
  </head>
  <body>
    <noscript>
      <div style="max-width:640px;margin:64px auto;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#111827;">
        <h1 style="font-size:24px;margin:0 0 12px 0;">IFA Backtest Engine</h1>
        <p style="font-size:15px;line-height:1.55;color:#4b5563;">
          Insight Fusion Analytics' client portal for systematic trading strategy backtests.
          This portal requires JavaScript to run — please enable it in your browser to sign in
          and view your dashboard.
        </p>
        <p style="font-size:13px;color:#6b7280;margin-top:24px;">
          For enquiries: <a href="mailto:hello@insightfusionanalytics.com">hello@insightfusionanalytics.com</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
